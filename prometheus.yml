global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  # The job name is added as a label `job=<job_name>` to any timeseries scraped from this config.
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'curriculum-api'
    static_configs:
      - targets: ['curriculum-api:8000']
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s

  - job_name: 'elasticsearch'
    static_configs:
      - targets: ['elasticsearch:9200']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']

  - job_name: 'postgresql'
    static_configs:
      - targets: ['postgres:5432']

  - job_name: 'mongodb'
    static_configs:
      - targets: ['mongo:27017']

  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx:80']
    metrics_path: '/stub_status'

# Alerting rules
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          # - alertmanager:9093

# Alert rules
groups:
  - name: curriculum_alerts
    rules:
    - alert: HighErrorRate
      expr: rate(curriculum_api_http_requests_total{status=~"5.."}[5m]) / rate(curriculum_api_http_requests_total[5m]) > 0.1
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "High error rate detected"
        description: "Error rate is {{ $value }}% over the last 5 minutes"

    - alert: HighLatency
      expr: histogram_quantile(0.95, rate(curriculum_api_http_request_duration_seconds_bucket[5m])) > 2
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "High API latency detected"
        description: "95th percentile latency is {{ $value }}s over the last 5 minutes"

    - alert: DatabaseConnectionFailures
      expr: increase(curriculum_api_db_connection_errors_total[5m]) > 5
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: "Database connection failures detected"
        description: "{{ $value }} database connection failures in the last 5 minutes"

    - alert: HighMemoryUsage
      expr: (1 - (curriculum_api_memory_available_bytes / curriculum_api_memory_total_bytes)) * 100 > 80
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "High memory usage detected"
        description: "Memory usage is {{ $value }}%"

    - alert: DiskSpaceLow
      expr: (curriculum_api_disk_available_bytes / curriculum_api_disk_total_bytes) * 100 < 20
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Low disk space detected"
        description: "Available disk space is {{ $value }}%"

