name: Security Scan

on:
  schedule:
    # Run weekly on Sundays at 2 AM UTC
    - cron: '0 2 * * 0'
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # actions/setup-python@v7.1.0
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install security tools
      run: |
        pip install safety bandit[toml] pip-audit

    - name: Run Safety (known vulnerabilities)
      run: |
        safety check --json --output safety-report.json || true

    - name: Run Bandit (security linter)
      run: |
        bandit -r src/ -f json -o bandit-report.json || true

    - name: Run pip-audit (PyPI vulnerabilities)
      run: |
        pip-audit --format=json --output pip-audit-report.json || true

    - name: Upload security reports
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # actions/upload-artifact@v7.0.2
      with:
        name: security-reports
        path: |
          safety-report.json
          bandit-report.json
          pip-audit-report.json
        retention-days: 90

    - name: Security summary
      run: |
        echo "## Security Scan Summary" >> $GITHUB_STEP_SUMMARY
        echo "- Safety: $(cat safety-report.json | jq '.vulnerabilities | length') vulnerabilities found" >> $GITHUB_STEP_SUMMARY
        echo "- Bandit: $(cat bandit-report.json | jq '.metrics._totals.baseline') baseline issues" >> $GITHUB_STEP_SUMMARY
        echo "- Pip-audit: $(cat pip-audit-report.json | jq '.vulnerabilities | length') vulnerabilities found" >> $GITHUB_STEP_SUMMARY

