name: Documentation

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'docs/**'
      - 'README.md'
      - 'pyproject.toml'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'docs/**'
      - 'README.md'
      - 'pyproject.toml'

permissions:
  contents: write

jobs:
  build-docs:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # actions/setup-python@v7.1.0
      with:
        python-version-file: ".python-version"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install documentation dependencies
      run: |
        pip install -e ".[docs]"

    - name: Generate documentation
      run: |
        # Generate API documentation
        python -c "
        from curriculum.documentation import DocumentationGeneratorService
        import tempfile
        import json

        with tempfile.TemporaryDirectory() as tmp_dir:
            doc_service = DocumentationGeneratorService(output_dir=tmp_dir)
            result = doc_service.generate_documentation(
                package_path='src/curriculum',
                use_llm=False
            )
            print(f'Documentation generated: {result}')
        "

    - name: Build MkDocs documentation
      run: |
        mkdocs build --clean

    - name: Deploy to GitHub Pages
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # peaceiris/actions-gh-pages@v4.1.0
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./site

