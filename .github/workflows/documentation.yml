name: Documentation

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'docs/**'
      - 'README.md'
      - 'pyproject.toml'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'docs/**'
      - 'README.md'
      - 'pyproject.toml'

jobs:
  build-docs:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install documentation dependencies
      run: |
        pip install -e ".[docs]"

    - name: Generate documentation
      run: |
        # Generate API documentation
        python -c "
        from curriculum.documentation import DocumentationGeneratorService
        import tempfile
        import json

        with tempfile.TemporaryDirectory() as tmp_dir:
            doc_service = DocumentationGeneratorService(output_dir=tmp_dir)
            result = doc_service.generate_documentation(
                package_path='src/curriculum',
                use_llm=False
            )
            print(f'Documentation generated: {result}')
        "

    - name: Build MkDocs documentation
      run: |
        mkdocs build --clean

    - name: Deploy to GitHub Pages
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./site
        cname: docs.curriculum-repository.com

