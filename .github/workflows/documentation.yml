name: Documentation

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'docs/**'
      - 'README.md'
      - 'mkdocs.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/documentation.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'docs/**'
      - 'README.md'
      - 'mkdocs.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/documentation.yml'

permissions:
  contents: read

jobs:
  build-docs:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # actions/setup-python@v7.1.0
      with:
        python-version-file: ".python-version"

    - name: Set up uv
      uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # astral-sh/setup-uv@v10.4.0
      with:
        version: "0.13.8"
        enable-cache: true
        cache-dependency-glob: uv.lock

    - name: Install locked dependencies
      run: |
        uv sync --frozen --extra dev --extra docs
        echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

    - name: Generate documentation
      run: |
        # Validate AST documentation generation without an LLM
        python - <<'PYTHON'
        import tempfile

        from curriculum.documentation import DocumentationGeneratorService

        with tempfile.TemporaryDirectory() as tmp_dir:
            doc_service = DocumentationGeneratorService(output_dir=tmp_dir)
            result = doc_service.generate_documentation(package_path="src/curriculum", use_llm=False)
            print(f"Documentation generated: {result}")
            assert result["status"] == "success", result
            assert result["modules_documented"] > 0 and result["files_documented"] > 0, result
        PYTHON

    - name: Build MkDocs documentation
      run: |
        mkdocs build --clean --strict

    - name: Upload site
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # actions/upload-artifact@v7.0.2
      with:
        name: site
        path: site
        retention-days: 1

  deploy-docs:
    runs-on: ubuntu-latest
    needs: build-docs
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write

    steps:
    - name: Download site
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # actions/download-artifact@v8.0.2
      with:
        name: site
        path: site

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # peaceiris/actions-gh-pages@v4.1.0
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./site
