name: Performance Tests

on:
  schedule:
    # Run performance tests weekly
    - cron: '0 3 * * 0'
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'

permissions:
  contents: read

jobs:
  performance-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # actions/setup-python@v7.1.0
      with:
        python-version-file: ".python-version"

    - name: Cache pip dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # actions/cache@v6.1.0
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt', 'pyproject.toml') }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest-benchmark

    - name: Install development dependencies
      run: |
        pip install -e ".[dev]"

    - name: Run performance tests
      run: |
        pytest tests/ -m slow --benchmark-only --benchmark-json=benchmark.json

    - name: Generate performance report
      run: |
        python -c "
        import json
        with open('benchmark.json', 'r') as f:
            data = json.load(f)
        print('## Performance Test Results')
        print('| Test | Mean Time | Std Dev |')
        print('|------|-----------|---------|')
        for test in data['benchmarks']:
            print(f'| {test[\"name\"]} | {test[\"stats\"][\"mean\"]:.4f}s | {test[\"stats\"][\"stddev\"]:.4f}s |')
        "

    - name: Upload benchmark results
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # actions/upload-artifact@v7.0.2
      with:
        name: benchmark-results
        path: benchmark.json
        retention-days: 30

    - name: Performance regression check
      run: |
        # This would compare current results with historical baselines
        # For now, just ensure tests completed successfully
        echo "Performance tests completed successfully"

