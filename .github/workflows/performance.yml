name: Performance Tests

on:
  schedule:
    # Run performance tests weekly
    - cron: '0 3 * * 0'
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'

jobs:
  performance-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt', 'pyproject.toml') }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest-benchmark

    - name: Install development dependencies
      run: |
        pip install -e ".[dev]"

    - name: Run performance tests
      run: |
        pytest tests/ -m slow --benchmark-only --benchmark-json=benchmark.json

    - name: Generate performance report
      run: |
        python -c "
        import json
        with open('benchmark.json', 'r') as f:
            data = json.load(f)
        print('## Performance Test Results')
        print('| Test | Mean Time | Std Dev |')
        print('|------|-----------|---------|')
        for test in data['benchmarks']:
            print(f'| {test[\"name\"]} | {test[\"stats\"][\"mean\"]:.4f}s | {test[\"stats\"][\"stddev\"]:.4f}s |')
        "

    - name: Upload benchmark results
      uses: actions/upload-artifact@v3
      with:
        name: benchmark-results
        path: benchmark.json
        retention-days: 30

    - name: Performance regression check
      run: |
        # This would compare current results with historical baselines
        # For now, just ensure tests completed successfully
        echo "Performance tests completed successfully"

