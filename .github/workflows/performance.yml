name: Performance Tests

on:
  schedule:
    # Run performance tests weekly
    - cron: '0 3 * * 0'
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/performance.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/performance.yml'

permissions:
  contents: read

jobs:
  performance-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # actions/setup-python@v7.1.0
      with:
        python-version-file: ".python-version"

    - name: Set up uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # astral-sh/setup-uv@v10.3.3
      with:
        version: "0.13.8"
        enable-cache: true
        cache-dependency-glob: uv.lock

    - name: Install locked dependencies
      run: |
        # pytest-benchmark is in the locked dev environment
        uv sync --frozen --extra dev --extra docs
        echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

    - name: Run performance tests
      run: |
        # Benchmarks enabled (not --benchmark-only) so every slow test runs; none are skipped.
        pytest tests/performance -m slow --no-cov --benchmark-json=benchmark.json

    - name: Generate performance report
      run: |
        python - <<'PYTHON' >> "$GITHUB_STEP_SUMMARY"
        import json

        with open("benchmark.json", encoding="utf-8") as f:
            data = json.load(f)
        assert data["benchmarks"], "no benchmarks recorded"
        print("## Performance Test Results")
        print("| Test | Mean Time | Std Dev |")
        print("|------|-----------|---------|")
        for test in data["benchmarks"]:
            stats = test["stats"]
            print(f"| {test['name']} | {stats['mean']:.4f}s | {stats['stddev']:.4f}s |")
        PYTHON

    - name: Upload benchmark results
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # actions/upload-artifact@v7.0.2
      with:
        name: benchmark-results
        path: benchmark.json
        retention-days: 30

    - name: Performance regression check
      run: |
        # This would compare current results with historical baselines
        # For now, just ensure tests completed successfully
        echo "Performance tests completed successfully"

